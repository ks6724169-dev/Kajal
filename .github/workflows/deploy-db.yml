name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Migrations and Update Config
        run: |
          mkdir -p supabase/migrations
          cp -rv server/database/migrations/* supabase/migrations/
          # Inject Project ID into config.toml to prevent "Missing required field" error
          sed -i 's/project_id = ""/project_id = "${{ secrets.SUPABASE_PROJECT_ID }}"/' supabase/config.toml

      - name: Link Project and Push Migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} -p ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} -p ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
