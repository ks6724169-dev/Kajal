name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Migrations to Supabase Folder
        run: |
          mkdir -p supabase/migrations
          cp -rv server/database/migrations/* supabase/migrations/

      - name: Push Migrations to Supabase
        run: |
          mkdir -p supabase
          echo 'project_id = "${{ secrets.SUPABASE_PROJECT_ID }}"' > supabase/config.toml
          supabase db push --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
